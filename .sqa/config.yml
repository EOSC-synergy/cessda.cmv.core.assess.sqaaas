config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.0.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/cessda.cmv.core:
      branch: main
      repo: https://github.com/cessda/cessda.cmv.core
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/cessda.cmv.core git:
        commands:
        - /usr/bin/env sh .sqa/script.chewy-periwinkle-buffalo.sh
        container: qc.acc_foggy-lilac-mau
  QC.Doc:
    repos:
      github.com/cessda/cessda.cmv.core find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-amber-swan.sh
        container: qc.doc_paltry-myrtle-emu
      github.com/cessda/cessda.cmv.core git:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-ivory-lemming.sh
        container: qc.doc_greasy-white-scorpion
      github.com/cessda/cessda.cmv.core markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-black-woodpecker.sh
        container: qc.doc_skimpy-white-chinook
  QC.Lic:
    repos:
      github.com/cessda/cessda.cmv.core licensee:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-violet-worm.sh
        container: qc.lic_gummy-wheat-sparrow
  QC.Met:
    repos:
      github.com/cessda/cessda.cmv.core cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.silly-charcoal-dachshund.sh
        container: qc.met_goopy-emerald-hare
  QC.Sty:
    repos:
      github.com/cessda/cessda.cmv.core checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-turquoise-angelfish.sh
        container: qc.sty_jumpy-razzmatazz-dingo
      github.com/cessda/cessda.cmv.core jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-jade-burmese.sh
        container: qc.sty_cranky-razzmatazz-catfish
  QC.Ver:
    repos:
      github.com/cessda/cessda.cmv.core get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-champagne-labradoodle.sh
        container: qc.ver_tacky-lime-dollar
timeout: 5400
